<html>
    <head>
        <link rel="stylesheet" href="../css/generalB.css" />
        <link rel="stylesheet" href="../css/boss.css" />
        <title>Bordedom Busters</title>
        <link href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="win-overlay" id="winOverlay">
            <div class="win-text" id="winText">
                <img src="../images/hats/NewMC1.png" class="win-dance" alt="dance">
                <p>Herzlichen Glückwunsch! Du hast gewonnen!</p>
                <button onclick="win()" class="button-style">Home</button>
            </div>
        </div>
        <div class="grid">
            <div class="left"> 
                <img id="mc-img" src="../images/NewMC1.png" width="100%" height="auto"/>
                <div class="level">
                    <div class="level-bar">
                        <div class="level-bar-fill" id="levelBar"></div>
                    </div>
                    <p id="level"></p>
                </div>
                <div id="chosenItems" class="chosen-grid">
                    <div class="grid-item">
                        <img id="item1" src="../images/empty.png" width="100px" height="100px"/>
                    </div>
                    <div class="grid-item">
                        <img id="item2" src="../images/empty.png" width="100px" height="100px"/>
                    </div>
                    <div class="grid-item">
                        <img id="item3" src="../images/empty.png" width="100px" height="100px"/>
                    </div>
                </div>
            </div>
            <div class="right">
                  

                <p id="swap">Aufgabe wählen, die gegen eine neue getauscht werden soll</p>
                <p id="clone">Aufgabe wählen, die gegen eine neue geklont werden soll</p>
                <p id="replace">Aufgabe wählen, die ersetzt werden soll</p>
                <div id="taskList" class="task-list"></div>
                <div class="timer">
                    <img src="../images/Timer.png" width="200px" height="auto"/>
                    <div class="timer-text" id="timerText">30:00</div>

                    <audio controls autoplay loop>
                        <source src="../images/ClockTicking.mp3" type="audio/mp3">
                      </audio>

                </div>
            </div>
        </div>
        <script>
            let bossTasks = {};
            let motivation = false;
            let clonedTask = "";

            function setup(){
                //aktuelles Level anzeigen
                const data = JSON.parse(localStorage.getItem("level"));
                const p = document.getElementById("level");
                if(data){
                    p.textContent = `Level: ${data.level}`;
                }else{
                    p.textContent = "0 / 10 Level: 0";
                }  
                levelBar(data);
                
                //aktuellen Main Character anzeigen
                let mc = JSON.parse(localStorage.getItem("mc"));
                const img = document.getElementById("mc-img");
                if(mc){
                    img.src = `../images/hats/${mc.file}`;
                }else{
                    img.src = "../images/hats/NewMC1.png";
                }
            }

            function levelBar(data){
                //Beite der LevelBar anhand des Fortschritts im level in % ausrechnen
                const bar = document.getElementById("levelBar");
                if(data){
                    const value = (data.current / data.goal) * 100;
                    bar.style.width = value + "%";
                }
            }

            function showChosenItems(){
                //ausgerüstete Items anzeigen
                const items = JSON.parse(localStorage.getItem("chosen"));
                const img1 = document.getElementById("item1");
                const img2 = document.getElementById("item2");
                const img3 = document.getElementById("item3");
                //erstmal alle Bilder, Titel und onclick Funktionen zurücksetzen
                img1.src = "../images/items/empty.png";
                img1.title = "";
                img1.onclick = null;
                img2.src = "../images/items/empty.png";
                img2.title = "";
                img2.onclick = null;
                img3.src = "../images/items/empty.png";
                img3.title = "";
                img3.onclick = null;

                if(items){
                    if(items[0]){
                        img1.src = `../images/items/${items[0].file}`;
                        img1.title = items[0].desc;
                        img1.onclick = () => {
                            const confirmed = confirm("Willst du das Item wirklich benutzen?");
                            if (!confirmed) return;

                            useItem(items[0]); 
                            img1.onclick = null;
                            img1.style.opacity = "0.5";
                        }
                    }
                    if(items[1]){
                        img2.src = `../images/items/${items[1].file}`;
                        img2.title = items[1].desc;
                        img2.onclick = () => {
                            const confirmed = confirm("Willst du das Item wirklich benutzen?");
                            if (!confirmed) return;

                            useItem(items[1]); 
                            img2.onclick = null;
                            img2.style.opacity = "0.5";
                        }
                    }
                    if(items[2]){
                        img3.src = `../images/items/${items[2].file}`;
                        img3.title = items[2].desc;
                        img3.onclick = () => {
                            const confirmed = confirm("Willst du das Item wirklich benutzen?");
                            if (!confirmed) return;

                            useItem(items[2]); 
                            img3.onclick = null;
                            img3.style.opacity = "0.5";
                        }
                    }
                }else{
                    localStorage.setItem("chosen", JSON.stringify([]));
                }
            }
            
            async function loadTasks() {
    try {
        // Daten von tasks.txt laden
        const response = await fetch("tasks.txt");
        const text = await response.text();

        // In ein Array umwandeln
        const tasks = text.trim().split('\n');

        // Zufällig mischen
        const mix = tasks.sort(() => 0.5 - Math.random());

        // Die ersten 3 nehmen
        const bossTaskArray = mix.slice(0, 3);

        if (!bossTasks.done) {
            bossTasks = {
                tasks: bossTaskArray,
                done: Array(bossTaskArray.length).fill(false)
            };
        } else {
            // Beim Neuladen Fortschritt behalten
            bossTasks = {
                tasks: bossTaskArray,
                done: bossTasks.done
            };
        }

        showTasks(bossTaskArray);
    } catch (error) {
        console.error('Fehler beim Laden der Aufgaben:', error);
    }
}

function showTasks(taskArray) {
    const list = document.getElementById("taskList");
    list.innerHTML = ''; // Liste leeren

    taskArray.forEach((task, i) => {
        // Container für die Aufgabe
        const taskContainer = document.createElement("div");
        taskContainer.classList.add("task-container");

        // Zufällige Drehung
        const randomRotation = Math.floor(Math.random() * 11) - 5;
        taskContainer.style.transform = `rotate(${randomRotation}deg)`;

        // Titel
        const taskTitle = document.createElement("h3");
        taskTitle.textContent = `Boss-Aufgabe ${i + 1}`;

        // Beschreibung
        const taskDescription = document.createElement("p");
        taskDescription.textContent = task;

        // Button
        const button = document.createElement("button");
        button.textContent = "Besiegt!";
        button.classList.add("button-style");
        button.style.marginTop = "100px";

        if (bossTasks.done[i]) {
            button.disabled = true;
            button.classList.add("disabled");

            const xOverlay = document.createElement("div");
            xOverlay.classList.add("x-overlay");
            xOverlay.textContent = "❌";
            taskContainer.appendChild(xOverlay);
        }

        button.addEventListener("click", () => taskDone(i));

        // Alles in Container einfügen
        taskContainer.appendChild(taskTitle);
        taskContainer.appendChild(taskDescription);
        taskContainer.appendChild(button);

        list.appendChild(taskContainer);
    });
}

function taskDone(i) {
    const button = event.target;
    button.disabled = true;

    bossTasks.done[i] = true;

    // Großes X
    const xOverlay = document.createElement("div");
    xOverlay.classList.add("x-overlay");
    xOverlay.textContent = "❌";
    button.parentElement.appendChild(xOverlay);

    // Container grau färben
    button.closest('.task-container').classList.add("finished");

    // Prüfen ob alle erledigt wurden
    if (bossTasks.done.every(done => done === true)) {
        const overlay = document.getElementById("winOverlay");
        overlay.style.display = "flex";
    }
}

// Direkt beim Laden
loadTasks();

            

function showTasks(taskArray) {
    const list = document.getElementById("taskList");
    list.innerHTML = ''; // Liste leeren

    taskArray.forEach((task, i) => {
        // Container für jede Aufgabe
        const taskContainer = document.createElement("div");
        taskContainer.classList.add("task-container");

        // Zufällige Drehung (optional für Stil)
        const randomRotation = Math.floor(Math.random() * 11) - 5;
        taskContainer.style.transform = `rotate(${randomRotation}deg)`;

        // Titel
        const taskTitle = document.createElement("h3");
        taskTitle.textContent = `Boss-Aufgabe ${i + 1}`;

        // Beschreibung
        const taskDescription = document.createElement("p");
        taskDescription.textContent = task;

        // Button
        const button = document.createElement("button");
        button.textContent = "Fertig!";
        button.classList.add("button-style");
        button.style.marginTop = "100px";

        if (bossTasks.done[i]) {
            button.disabled = true;
            button.classList.add("disabled");

            const xOverlay = document.createElement("div");
            xOverlay.classList.add("x-overlay");
            xOverlay.textContent = "❌";
            taskContainer.appendChild(xOverlay);

            taskContainer.classList.add("finished");
        }

        button.addEventListener("click", () => taskDone(i));

        // Alles zusammenbauen
        taskContainer.appendChild(taskTitle);
        taskContainer.appendChild(taskDescription);
        taskContainer.appendChild(button);

        list.appendChild(taskContainer);
    });
}


            loadTasks();
            setup();
            showChosenItems();

            //Timer (30 Minuten)
            let timeInSeconds = 1799;

            function updateTimer() {
                //Berechnen der Minuten und Sekunden
                const minutes = Math.floor(timeInSeconds / 60);
                const seconds = timeInSeconds % 60;

                //Formatieren der Zeit im MM:SS-Format
                const timeString = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

                //Den Text des Timers aktualisieren
                document.getElementById('timerText').textContent = timeString;

                //Zeit um eine Sekunde reduzieren
                timeInSeconds--;

                //Wenn der Timer abgelaufen ist, stoppen
                if (timeInSeconds < 0) {
                    clearInterval(timerInterval);
                    const overlay = document.getElementById("winOverlay");
                    overlay.style.display = "flex";
                    const loseText = document.getElementById("winText");
                    loseText.innerHTML = 'Verloren! :(<br><a href="home.html" class="button-style">Home</a>';
                }
            }

            function win() {
    // Das Overlay anzeigen, wenn der Boss besiegt wurde
    const winOverlay = document.getElementById('winOverlay');
    winOverlay.style.display = 'flex';
}


            //setInterval nutzen, um funktion jede Sekunde aufzurufen
            const timerInterval = setInterval(updateTimer, 1000);

            function win(){
                //boss auf false setzen, XP bekommen und zur Home Seite zurückgehen
                const data = JSON.parse(localStorage.getItem("level"));
                data.boss = false;
                if(motivation){
                    data.current += 10;
                }else{
                    data.current += 5;
                }
                localStorage.setItem("level", JSON.stringify(data));
                window.open("home.html", "_self");
            }

            function useItem(item){
                //Fähigkeit des Items nutzen
                switch(item.name){
                    case "Motivation":
                        motivation = true;
                        break;
                    case "Zeitbonus":
                        timeInSeconds += 120;
                        break;
                    case "Mischen":
                        loadTasks();
                        break;
                    case "Kartentausch":
                        //in "Aufgabe austauschen" Modus wechseln
                        changeOnClick(swap);
                        document.getElementById("swap").style.display = "block";
                        break;
                    case "Klonen":
                        changeOnClick(clone);
                        document.getElementById("clone").style.display = "block";
                        break;
                }

                //Item wird aufgebraucht
                const chosen = JSON.parse(localStorage.getItem("chosen"));
                const index = chosen.findIndex(c => c.id === item.id);
                if (index !== -1) {
                    chosen.splice(index, 1);
                    localStorage.setItem("chosen", JSON.stringify(chosen));
                }
            }

            function changeOnClick(newFunction){
                const buttons = document.querySelectorAll("#taskList button");
                buttons.forEach((button, i) => {
                    button.onclick = () => newFunction(i);
                });
            }

            async function swap(i){
                //Daten von tasks.txt laden
                const response = await fetch("tasks.txt");
                const text = await response.text();

                //In ein Array umwandeln
                const tasks = text.trim().split('\n');

                //Zufällige Zeile wählen
                const randomLine = tasks[Math.floor(Math.random() * tasks.length)];

                //gewählte Aufgabe ersetzen
                bossTasks.tasks[i] = randomLine;

                //Wieder in "Aufgaben abhaken"-Modus wechseln
                changeOnClick(taskDone);
                document.getElementById("swap").style.display = "none";
                showTasks(bossTasks.tasks);
            }

            function clone(i){
                clonedTask = bossTasks.tasks[i];
                changeOnClick(replace);
                document.getElementById("clone").style.display = "none";
                document.getElementById("replace").style.display = "block";
            }

            function replace(i){
                bossTasks.tasks[i] = clonedTask;
                changeOnClick(taskDone);
                document.getElementById("replace").style.display = "none";
                showTasks(bossTasks.tasks);
            }



        </script>


    </body>
</html>
