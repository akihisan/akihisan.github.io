<html>
    <head>
        <link rel="stylesheet" href="css/generalB.css" />
        <link rel="stylesheet" href="css/indexB.css" />
        <title>Bordedom Busters</title>
        <link href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="grid">
            <div class="left"> 
                <img src="images/hats/NewMC1.png" width="100%" height="auto"/>
                <p id="level"></p>
                <div class="button-box">
                    <a href="pages/tasks.html" class="button-style disabled">Aufgaben</a>
                    <a href="pages/clothes.html" class="button-style disabled">Kleiderschrank</a>
                    <a href="pages/items.html" class="button-style disabled">Items</a>
                    <a href="pages/home.html" class="button-style disabled">Home</a>
                </div>
            </div>
            <div class="right">
                <div class ="overworld-container">
                       <!-- Bild immer rechts daneben -->
                       <img src="../images/NPC1.png" alt="Willy" class="dialogue-image" id="npc">
                <div class="dialogue-section">
                    <!-- alle Dialoge hier rein -->
                    <div class="dialogue-container" id="firstDialog" style="display: block;">
                      <p>“Willkommen tapfere(r).. Wer bist du nochmal? Naja..”</p>
                      <div class="button-row">
                        <a href="pages/home.html" class="button-style">Anmelden</a>
                        <button onclick="showDialog('registerDialog')" class="button-style">Registrieren</button>
                      </div>
                      
                    </div>
                  
                    <div class="dialogue-container" id="registerDialog">
                      <p>Du hast dich registriert!</p>
                      <div class="button-row">
                        <button onclick="localStorage.clear(); showDialog('dialogueContainer')" class="button-style">Weiter</button>
                      </div>
                    </div>
                  
                    <div class="dialogue-container" id="dialogueContainer">
                      <p id="textContainer"></p>
                      <div class="button-row">
                        <button id="nextButton" onclick="changeText()" class="button-style">Weiter</button>
                      </div>
                    </div>
                </div>
                  
                </div>
         
        </div>
        <script>
            function setup(){
                const p = document.getElementById("level");
                p.textContent = "0 / 10 Level: 0";
            }
            setup();

            function showDialog(dialogId) {
                const allDialogs = document.querySelectorAll('.dialogue-container');
                allDialogs.forEach(dialog => dialog.style.display = 'none');

                document.getElementById(dialogId).style.display = 'block';

                // Text anzeigen, wenn es der finale Dialog ist
                if (dialogId === 'dialogueContainer') {
                    index = 0;
                    document.getElementById('textContainer').textContent = texts[index];
                }
            }

            const texts = [
            "Ah! Jetzt erinnere ich mich! Ich bin Willy, dein absolut professioneller und emotional stabiler bester.. und einziger.. Freund! Ich erklär dir jetzt mal alles, ja?",
            "Gerade befinden wir uns in Balkonien- hier können wir jederzeit quatschen. Hier tauchen auch deine alltäglichen Szenarios.. oder sollte ich sagen, schlimmste Alpträume?.. auf.",
            "Auf der linken Seite siehst du verschiedene Knöppe. Oben links hast du deine täglichen Aufgaben. Die ändern sich… täglich. Offensichtlich. Guck sie dir regelmäßig an.",
            "Weiter gehts. Rechts daneben ist dein Kleiderschrank. Zieh an, was dir gefällt.. oder lass es eben. Hast vielleicht kein Hutgesicht, hm. Du bekommst neue Hüte, indem du dein Level verbesserst.",
            "Das siehst du direkt unter dir- das ist diese Leiste, wo XP draufsteht- eXtreme Preise.. versteht sich von selbst.",
            "Du kannst auch Gegenständige bekommen, wenn du deine täglichen Aufgaben erledigst. Wie du sie benutzt? KLick sie einfach an!",
            "Pass aber auf, sie sind nur hilfreich gegen deine schlimmsten Alpträume…",
            "Und zum Schluss noch ein Tipp von mir: Wenn du alle täglichen Aufgaben machst, regnet es Geschenke!"
            ];

            let index = 0;

            function changeText() {
                if (index < texts.length - 1) {
                    index++;
                    document.getElementById('textContainer').textContent = texts[index];
                }
                if(index == texts.length - 1){
                    const button = document.getElementById("nextButton");
                    button.onclick = goHome;
                    button.textContent = "Fertsch";
                }
            }

            function goHome(){
                window.open("pages/home.html", "_self");
            }


            document.addEventListener("DOMContentLoaded", () => {
    const npc = document.getElementById("npc");

    // Init
    npc.style.position = "absolute";
    npc.style.left = "100px"; // or wherever you want them placed
    npc.style.top = "100px";
    npc.style.animation = "talkingWilly 1s ease-in-out infinite";
});


        </script>
    </body>
</html>
