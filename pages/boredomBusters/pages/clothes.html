<html>
    <head>
        <link rel="stylesheet" href="../css/generalB.css" />
        <link rel="stylesheet" href="../css/clothes.css" />
        <title>Bordedom Busters</title>
        <link href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="grid">
            <div class="left"> 
                <img id="mc-img" src="../images/NewMC1.png" width="100%" height="auto"/>
                <div class="level">
                    <div class="level-bar">
                        <div class="level-bar-fill" id="levelBar"></div>
                    </div>
                <p id="level"></p>
                </div>
                <div class="button-box">
                    <a href="tasks.html" class="button-style">Aufgaben</a>
                    <a href="clothes.html" class="button-style">Kleiderschrank</a>
                    <a href="items.html" class="button-style">Items</a>
                    <a href="home.html" class="button-style">Home
                        <img id="exclamation" src="../images/Ausrufezeichen1.png" class="exclamation"/>
                    </a>
                </div>
            </div>
            <div class="right">
                <div id="itemGrid" class="griddy"></div>
            </div>
        </div>

        <script>
            function setup(){
                //aktuelles Level anzeigen
                const data = JSON.parse(localStorage.getItem("level"));
                const p = document.getElementById("level");
                if(data){
                    p.textContent = `Level: ${data.level}`;
                }else{
                    p.textContent = "0 / 10 Level: 0";
                }
                levelBar(data);

                //aktuellen Main Character anzeigen
                let mc = JSON.parse(localStorage.getItem("mc"));
                const img = document.getElementById("mc-img");
                if(mc){
                    img.src = `../images/hats/${mc.file}`;
                }else{
                    img.src = "../images/hats/NewMC1.png";
                }

                //Ausrufezeichen anzeigen wenn Boss da ist
                if(data.boss){
                    document.getElementById("exclamation").style.display = "inline-block";

                }else{
                    document.getElementById("exclamation").style.display = "none";
                }
            }

            setup();

            function levelBar(data){
                //Beite der LevelBar anhand des Fortschritts im level in % ausrechnen
                const bar = document.getElementById("levelBar");
                if(data){
                    const value = (data.current / data.goal) * 100;
                    bar.style.width = value + "%";
                }
            }

            function showHats(){
                const hats = JSON.parse(localStorage.getItem("hats"));
                const list = document.getElementById("itemGrid");
                list.innerHTML = "";

                // Leeres Element zum Absetzen der Hüte
                const div = document.createElement("div");
                list.appendChild(div);
                //Text
                const p = document.createElement("p");
                p.textContent = "Hut absetzen";
                p.style.fontWeight = "bold";
                p.style.textAlign = "center";
                p.style.marginBottom = "0";
                div.appendChild(p);
                //Bild
                const imageBox = document.createElement("div");
                imageBox.className = "grid-item";
                div.appendChild(imageBox);
                //onclick-Event
                imageBox.addEventListener('click', () => {
                    imageBox.classList.add('selected');
                    setTimeout(() => {
                        imageBox.classList.remove('selected');
                    }, 800);
                    takeOffHat(); // direkt Hut absetzen beim Klick!
                });
                const img = document.createElement("img");
                img.src = "../images/items/empty.png";
                img.style.width = "100px";
                img.style.height = "auto";
                img.style.cursor = "pointer";
                imageBox.appendChild(img);

                //Jetzt die Hüte anzeigen
                for (let hat of hats) {
                    if (hat.inventory) {
                        const div = document.createElement("div");
                        list.appendChild(div);
                        //Text
                        const p = document.createElement("p");
                        p.textContent = hat.name;
                        p.style.fontWeight = "bold";
                        p.style.textAlign = "center";
                        p.style.marginBottom = "0px";
                        div.appendChild(p);
                        //Bild-Box
                        const imageBox = document.createElement("div");
                        imageBox.className = "grid-item";
                        div.appendChild(imageBox);
                        //onclick-Event
                        imageBox.addEventListener('click', () => {
                            imageBox.classList.add('selected');
                            setTimeout(() => {
                                imageBox.classList.remove('selected');
                            }, 800);
                            wearHat(hat); // Hut aufsetzen
                        });
                        //Maske fürs Bild
                        const mask = document.createElement("div");
                        mask.className = "portrait-frame";
                        imageBox.appendChild(mask);
                        //Bild
                        const img = document.createElement("img");
                        img.src = `../images/hats/${hat.file}`;
                        mask.appendChild(img);
                    }
                }
            }


            showHats();

            function wearHat(hat){
                //Dateiname des angeklickten Huts speichern
                const mc = JSON.parse(localStorage.getItem("mc"));
                mc.file = hat.file;
                localStorage.setItem("mc", JSON.stringify(mc));
                //neuen Hut anzeigen
                const img = document.getElementById("mc-img");
                img.src = `../images/hats/${hat.file}`;
            }

            function takeOffHat(){
                //Dateiname von MC ohne Hut speichern
                const mc = JSON.parse(localStorage.getItem("mc"));
                mc.file = "NewMC1.png";
                localStorage.setItem("mc", JSON.stringify(mc));
                //neues Bild anzeigen
                const img = document.getElementById("mc-img");
                img.src = "../images/hats/NewMC1.png";
            }

            document.querySelectorAll('.grid-item').forEach(item => {
  item.addEventListener('click', () => {
    item.classList.add('selected');
    setTimeout(() => {
      item.classList.remove('selected');
    }, 800);
  });
});


        </script>
    </body>
</html>
