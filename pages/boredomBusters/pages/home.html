<html>
    <head>
        <link rel="stylesheet" href="../css/generalB.css" />
        <link rel="stylesheet" href="../css/home.css" />
        <title>Bordedom Busters</title>
        <link href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap" rel="stylesheet">
    <body>
        <div class="grid">
            <div class="left"> 
                <img id="mc-img" src="../images/hats/NewMC1.png" width="100%" height="auto"/>
                <div class="level">
                    <div class="level-bar">
                        <div class="level-bar-fill" id="levelBar"></div>
                    </div>
                    <p id="level"></p>
                </div>
                <div class="button-box">
                    <a href="tasks.html" class="button-style">Aufgaben</a>
                    <a href="clothes.html" class="button-style">Kleiderschrank</a>
                    <a href="items.html" class="button-style">Items</a>
                    <a id="homeButton" href="home.html" class="button-style">Home 
                        <img id="exclamation" src="../images/Ausrufezeichen1.png" class="exclamation"/>
                    </a>
                </div>
            </div>
            <div class="right">
                <div class ="overworld-container">
   <!-- Bild immer rechts daneben -->
   <img src="../images/NPC1.png" alt="Willy" class="dialogue-image" id="npc">
                <div class="dialogue-section">
                    <div class="dialogue-container" id="dialogueContainer">
                    <p id="textContainer"></p>
                    </div>
                </div>
                </div>

             
                
                <!-- BossButton darunter -->
                <button id="bossButton" onclick="goToBoss()" class="button-style">Zum Bosskampf</button>

                <div id="itemPopup" class="popup">
                    <div class="popup-content" id="content">
                        <p id="rewardText">Halt stop! Du hast ja noch gar nicht 3 Items gewählt! Bist du sicher, dass du so in den Kampf ziehen willst?</p>
                        <button id="closeButton" onclick="window.open('boss.html', '_self');" class="button-style">Zum Bosskampf</button>
                        <button id="closeButton" onclick="window.open('items.html', '_self');" class="button-style">Items ausrüsten</button>
                    </div>
                </div>
            </div>
        </div>
    </body>
    <script>
        //localStorage.clear();

        const texts = [
            "Ich hab mal ein Sandwich getauft. Es heißt jetzt Klaus.",
            "Ein gut trainierter Vogel kann mehr Mathematik als ein Hamburger.",
            "Die Horizontale ist meine Lieblingsvertikale.",
            "Trag immer eine Banane bei dir. Für Notfälle.. Vertrau mir.",
            "Magst du Kochen? Ich kenn da so eine, die piept dabei..",
            "Wenn du dreimal schnell “Willy” sagst, dann erscheint er. Ach warte, bin ja schon hier.",
            "Der eine Entwickler mag Grüüün.",
            "Der andere Entwickler ist wie so nh Pflanze- nur glücklich, wenn die Sonne scheint."
        ];

        //zufälligen Text anzeigen
        function changeText() {
            const index = Math.floor(Math.random() * texts.length);
            document.getElementById("textContainer").textContent = texts[index];
        }

        function setupLevel(){
            let data = JSON.parse(localStorage.getItem("level"));
            if(data){
                console.log("Level-Daten vorhanden");
            }else{
                console.log("Erstelle neue Level-Daten");
                localStorage.setItem("level", JSON.stringify({
                    goal: 10,
                    current: 0,
                    level: 0,
                    boss: false,
                    bossFile: ""
                }));
            }
            data = JSON.parse(localStorage.getItem("level"));
            const p = document.getElementById("level");
            p.textContent = `Level: ${data.level}`;

            levelBar(data);

            //ist gerade ein Boss da?
            if(data.boss){
                document.getElementById("exclamation").style.display = "inline-block";
                document.getElementById("bossButton").style.display = "block";
                document.getElementById("npc").src = `../images/boss/${data.bossFile}`;
                document.getElementById("textContainer").textContent = "Haha! Ich bin ein Boss! Bekämpfe mich!";

            }else{
                document.getElementById("exclamation").style.display = "none";
                document.getElementById("bossButton").style.display = "none";
                document.getElementById("npc").src = "../images/NPC1.png";
                changeText();
            }
        }

        function levelBar(data){
            //Beite der LevelBar anhand des Fortschritts im level in % ausrechnen
            const bar = document.getElementById("levelBar");
            const value = (data.current / data.goal) * 100;
            bar.style.width = value + "%";
        }

        function setupItems(){
            let data = JSON.parse(localStorage.getItem("items"));
            if(data){
                console.log("Item-Daten vorhanden");
            }else{
                localStorage.setItem("items", JSON.stringify([
                    {name: "Zeitbonus", amount: 0, desc: "Erhalte 2 Minuten mehr Zeit", file: "ItemAddTime1.png"},
                    {name: "Klonen", amount: 0, desc: "Verdopple eine Aufgabe, lösche eine andere", file: "ItemDuplicate1.png"},
                    {name: "Kartentausch", amount: 0, desc: "Tausche eine Aufgabe gegen eine neue", file: "ItemSwitchOneCard1.png"},
                    {name: "Mischen", amount: 0, desc: "Tausche alle Aufgabe gegen neue aus", file: "ItemShuffle1.png"},
                    {name: "Motivation", amount: 0, desc: "Erhalte mehr XP für den Kampf", file: "ItemBonusXP1.png"}
                ]));
            }
        }

        function setupHats(){
            let data = JSON.parse(localStorage.getItem("hats"));
            if(data){
                console.log("Hut-Daten vorhanden");
            }else{
                localStorage.setItem("hats", JSON.stringify([
                    {name: "Heiligenschein", inventory: false, file: "NewMCHeiligenschein.png"},
                    {name: "Hexenhut", inventory: false, file: "NewMCMagicHat.png"},
                    {name: "Baskenhut", inventory: false, file: "NewMCBaskenhut.png"},
                    {name: "Blume", inventory: false, file: "NewMCBlume.png"},
                    {name: "Partyhut", inventory: false, file: "NewMCPartyhut.png"},
                    {name: "Propellerhut", inventory: false, file: "NewMCPropellerhut.png"},
                    {name: "Schleife", inventory: false, file: "NewMCSchleife.png"}
                ]));
            }
        }

        function setupMC(){
            let data = JSON.parse(localStorage.getItem("mc"));
            if(data){
                console.log("Main-Character-Daten vorhanden");
                const img = document.getElementById("mc-img");
                img.src = `../images/hats/${data.file}`;
            }else{
                localStorage.setItem("mc", JSON.stringify({file: "NewMC1.png"}));
                const img = document.getElementById("mc-img");
                img.src = "../images/hats/NewMC1.png";
            }
        }

        setupLevel();
        setupItems();
        setupHats();
        setupMC();

        function goToBoss(){
            const data = JSON.parse(localStorage.getItem("chosen"));
            if(data && data.length === 3){
                //boss.html öffnen
                window.open("boss.html", "_self");
            }else{
                //popup anzeigen
                document.getElementById("itemPopup").style.display = "flex";
            }


        }

        


        document.addEventListener("DOMContentLoaded", () => {
    const npc = document.getElementById("npc");

    // Init
    npc.style.position = "absolute";
    npc.style.left = "100px"; // or wherever you want them placed
    npc.style.top = "100px";
    npc.style.animation = "talkingWilly 1s ease-in-out infinite";
});



            

    </script>
</html>
