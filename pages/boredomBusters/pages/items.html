<html>
    <head>
        <link rel="stylesheet" href="../css/generalB.css" />
        <link rel="stylesheet" href="../css/items.css" />
        <title>Bordedom Busters</title>
        <link href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="grid">
            <div class="left"> 
                <img id="mc-img" src="../images/NewMC1.png" width="100%" height="auto"/>
                <div class="level">
                    <div class="level-bar">
                        <div class="level-bar-fill" id="levelBar"></div>
                    </div>
                    <p id="level"></p>
                </div>
                <div class="button-box">
                    <a href="tasks.html" class="button-style">Aufgaben</a>
                    <a href="clothes.html" class="button-style">Kleiderschrank</a>
                    <a href="items.html" class="button-style">Items</a>
                    <a href="home.html" class="button-style">Home
                        <img id="exclamation" src="../images/Ausrufezeichen1.png" class="exclamation"/>
                    </a>
                </div>
            </div>
            <div class="right">
                <h2>Ausgerüstete Items</h2>
                <div id="chosenItems" class="chosen-grid">
                    <div class="grid-item">
                        <img id="item1" src="../images/items/empty.png" width="100px" height="100px"/>
                    </div>
                    <div class="grid-item">
                        <img id="item2" src="../images/items/empty.png" width="100px" height="100px"/>
                    </div>
                    <div class="grid-item">
                        <img id="item3" src="../images/items/empty.png" width="100px" height="100px"/>
                    </div>
                </div>
                <h2>Inventar</h2>
                <div id="itemGrid" class="griddy"></div>
                
            </div>
        </div>
        <script>

            function showItems(){
                const data = JSON.parse(localStorage.getItem("items"));
                const list = document.getElementById("itemGrid");
                list.innerHTML = ""; // vorherige Liste löschen

                //Grid
                for (let item of data) {
                    if (item.amount > 0) { // nur anzeigen, wenn man das Item besitzt
                        //div erzeugen, dass alles zum Item enthält
                        const div = document.createElement("div");
                        div.title = item.desc; //Beschreibung als Tooltip anzeigen
                        list.appendChild(div);
                        //p erzeugen, an div hängen
                        const p = document.createElement("p");
                        p.textContent = `${item.amount}x ${item.name}`;
                        p.style.fontWeight = "bold";
                        div.appendChild(p);
                        //Box fürs Bild erzeugen
                        const imageBox = document.createElement("div");
                        imageBox.className = "grid-item";
                        div.appendChild(imageBox);
                        //img erzeugen, an div hängen
                        const img = document.createElement("img");
                        img.src = `../images/items/${item.file}`;
                        img.style.width = "100px";
                        img.style.height = "auto";
                        img.addEventListener("click", () => addItem(item));
                        imageBox.appendChild(img);
                    }
                }
            }

            function addItem(item){
                //neues Item im localStorage abspeichern
                const chosen = JSON.parse(localStorage.getItem("chosen"));
                const newItem = {name: item.name, desc: item.desc, file: item.file, id: Date.now()};
                chosen.push(newItem);
                localStorage.setItem("chosen", JSON.stringify(chosen));

                //Anzahl des gewählten Items im Inventar verringern
                const items = JSON.parse(localStorage.getItem("items"));
                for(let i of items){
                    if(item.name === i.name){
                        i.amount -= 1;
                    }
                }
                localStorage.setItem("items", JSON.stringify(items));

                //neue Items anzeigen
                showChosenItems();
                showItems();
            }

            function removeItem(item){
                //item mit übereinstimmender id entfernen
                const chosen = JSON.parse(localStorage.getItem("chosen"));
                const index = chosen.findIndex(c => c.id === item.id);
                if (index !== -1) { //-1 würde bedeuten, dass der index nicht gefunden wurde
                    chosen.splice(index, 1);
                    localStorage.setItem("chosen", JSON.stringify(chosen));
                }

                //Anzahl des gewählten Items im Inventar erhöhen
                const items = JSON.parse(localStorage.getItem("items"));
                for(let i of items){
                    if(item.name === i.name){
                        i.amount += 1;
                    }
                }
                localStorage.setItem("items", JSON.stringify(items));

                //neue Items anzeigen
                showChosenItems();
                showItems();
            }

            function showChosenItems(){
                //ausgerüstete Items anzeigen
                const items = JSON.parse(localStorage.getItem("chosen"));
                const img1 = document.getElementById("item1");
                const img2 = document.getElementById("item2");
                const img3 = document.getElementById("item3");
                //erstmal alle Bilder, Titel und onclick Funktionen zurücksetzen
                img1.src = "../images/items/empty.png";
                img1.title = "";
                img1.onclick = null;
                img2.src = "../images/items/empty.png";
                img2.title = "";
                img2.onclick = null;
                img3.src = "../images/items/empty.png";
                img3.title = "";
                img3.onclick = null;

                if(items){
                    if(items[0]){
                        img1.src = `../images/items/${items[0].file}`;
                        img1.title = items[0].name;
                        img1.onclick = () => removeItem(items[0]);
                    }
                    if(items[1]){
                        img2.src = `../images/items/${items[1].file}`;
                        img2.title = items[1].name;
                        img2.onclick = () => removeItem(items[1]);
                    }
                    if(items[2]){
                        img3.src = `../images/items/${items[2].file}`;
                        img3.title = items[2].name;
                        img3.onclick = () => removeItem(items[2]);
                    }
                }else{
                    localStorage.setItem("chosen", JSON.stringify([]));
                }
            }

            function setup(){
                //aktuelles Level anzeigen
                const data = JSON.parse(localStorage.getItem("level"));
                const p = document.getElementById("level");
                if(data){
                    p.textContent = `Level: ${data.level}`;
                }else{
                    p.textContent = "0 / 10 Level: 0";
                }    
                levelBar(data); 
                
                //aktuellen Main Character anzeigen
                let mc = JSON.parse(localStorage.getItem("mc"));
                const img = document.getElementById("mc-img");
                if(mc){
                    img.src = `../images/hats/${mc.file}`;
                }else{
                    img.src = "../images/hats/NewMC1.png";
                }

                //Ausrufezeichen anzeigen wenn Boss da ist
                if(data.boss){
                    document.getElementById("exclamation").style.display = "inline-block";

                }else{
                    document.getElementById("exclamation").style.display = "none";
                }
            }

            function levelBar(data){
                //Beite der LevelBar anhand des Fortschritts im level in % ausrechnen
                const bar = document.getElementById("levelBar");
                if(data){
                    const value = (data.current / data.goal) * 100;
                    bar.style.width = value + "%";
                }
            }

            setup();
            showItems();
            showChosenItems();
        </script>
    </body>
</html>
